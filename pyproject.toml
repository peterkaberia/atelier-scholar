[project]
name = "atelier"
version = "0.1.0"
description = "An open-source, AI-powered academic research synthesizer and literature copilot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "dash[celery,diskcache]",
    "langchain",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-ollama",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "numpy",
    "pandas",
    "pypdf",
    "python-dotenv",
    "requests",
    "sentence-transformers",
    "sqlalchemy>=2.0.51",
    "tenacity",
    "torch",
    "torchvision",
]

[tool.uv]
package = false
